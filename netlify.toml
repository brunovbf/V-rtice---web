[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.18.1"

# Los formularios de la landing y de las demos abren WhatsApp desde el cliente,
# asi que no hace falta ninguna funcion ni redirect.

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
